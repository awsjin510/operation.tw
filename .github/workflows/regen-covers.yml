name: Regenerate Covers

# 一次性：用新版合成參數重生 Podcast 文章封面（更清晰），重建靜態頁後 commit。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Regenerate podcast covers
        env:
          CF_API_BASE: ${{ secrets.CF_API_BASE }}
          CF_SERVICE_TOKEN: ${{ secrets.CF_SERVICE_TOKEN }}
        run: node scripts/regen-covers.js

      - name: Rebuild static site (regenerates WebP)
        env:
          CF_API_BASE: ${{ secrets.CF_API_BASE }}
          CF_SERVICE_TOKEN: ${{ secrets.CF_SERVICE_TOKEN }}
        run: node scripts/build-static.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/ post/ category/ sitemap.xml feed.xml llms.txt llms-full.txt index.html posts.json
          if git diff --cached --quiet; then
            echo "無變更"
          else
            git commit -m "chore(covers): 以新版合成參數重生 Podcast 封面"
            for r in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then break; fi
              echo "push 失敗，重試…"; sleep $((r * 3))
            done
          fi
