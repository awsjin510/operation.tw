name: Backup D1

# 每日備份 D1 全站資料（文章/設定/統計/訂閱者），加密後存成 Actions artifact（保留 90 天）。
# 不再 commit 進 repo：repo 與網站都是公開的，含訂閱者 email 的備份不該可被任何人下載。
# 還原方式見 backups/README.md。
on:
  schedule:
    - cron: '30 19 * * *'   # 每天 03:30 台灣時間
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Export & encrypt D1 backup
        env:
          CF_API_BASE: ${{ secrets.CF_API_BASE }}
          CF_SERVICE_TOKEN: ${{ secrets.CF_SERVICE_TOKEN }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: node scripts/backup-d1.js

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backups/d1-latest.json.gz.enc
          retention-days: 90
          if-no-files-found: error
