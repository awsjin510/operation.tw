name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    # 所有「會用 bot 身分 commit 網站內容」的 workflow 都要列進來——
    # GITHUB_TOKEN 的 push 不會觸發 on:push，漏列的 workflow 改了內容也不會部署。
    workflows:
      - "Daily News Auto-Post"
      - "Sync Post Views"
      - "Podcast Watch"
      - "Generate Glossary"
      - "Photo Covers Backfill"
      - "Regenerate Covers"
      - "Backfill FAQ / TL;DR"
      - "Podcast Backfill"
      - "Podcast Update Titles"
      - "Restore Content (D1 修復)"
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static files
        run: |
          mkdir -p _site
          # 白名單部署：只複製網站需要的檔案。
          # （repo 裡的備份、restore 資料、內部筆記、狀態檔都不該被公開存取。）
          # 新增公開目錄或根目錄檔案類型時，記得同步加到這裡。
          DIRS="about ai category cloud faq glossary images js podcast post publiccloud security"
          for d in $DIRS; do [ -d "$d" ] && cp -R "$d" _site/; done
          shopt -s nullglob
          for f in *.html *.css *.js *.xml *.png *.jpg *.webp *.ico *.svg \
                   CNAME robots.txt llms.txt llms-full.txt \
                   posts.json episodes.json glossary.json; do
            cp "$f" _site/
          done
          # IndexNow / 搜尋引擎驗證金鑰（32 碼 hex 檔名）
          for f in [0-9a-f]*.txt; do
            if [[ "$f" =~ ^[0-9a-f]{32}\.txt$ ]]; then cp "$f" _site/; fi
          done
          echo "部署檔案數：$(find _site -type f | wc -l)"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
